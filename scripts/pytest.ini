# Repeats packages/tools/pyproject.toml's `timeout`, `required_plugins` and markers: these tests
# run under that project's conftest and must mean by a marker what it means there.
[pytest]
testpaths = tests
pythonpath = ../packages/tools/tests ../packages/tools/tests/support
timeout = 1200
required_plugins = pytest-timeout>=2.3
markers =
    slow: marks a suite that is minutes rather than seconds (here: the agent task benchmark on the large bench and the runner's --project suites). Deselected from the fast 'dev.py test' gate, executed only by 'dev.py test-slow'; deselect explicitly with '-m not slow'. packages/tools/tests/test_slow_marker_inventory.py derives the list of marked suites -- never restate it here
    artifact: marks tests that build wheels/.vsix or create a venv (deselected from the fast test run, executed only by 'dev.py test-artifacts', which 'dev.py verify' invokes)
    integration: marks tests that invoke moon against a scaffolded standalone architecture project (deselected from the fast test run, executed only by 'dev.py test-model-integration', which 'dev.py verify' invokes and which FAILS — never skips — when moon is unresolvable)
# The tools conftest is loaded by path, which assertion rewriting cannot reach; accepted, so the
# warning is not repeated on every run.
filterwarnings =
    ignore:Module already imported so cannot be rewritten; tools_conftest:pytest.PytestAssertRewriteWarning
