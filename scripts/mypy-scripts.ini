# mypy over the repository scripts (`scripts/*.py`, `scripts/workstation/*.py`; their tests are not named),
# run from the repository root by `dev.py lint`'s "lint scripts" step through `run_python_lint.py --mypy-config`.
# The platform and version are fixed, so a Mac, Linux and Windows host check the same thing.
#
# The modules below are exempt by name (`ignore_errors`); every other script under the two globs is checked at
# zero. A script in a new subdirectory is reached only once `files` names it, which `test_dev_script.py` requires.
# The list may only shrink (`test_dev_script.py` holds it to a ceiling): a module whose errors are cleared loses
# its section.
[mypy]
python_version = 3.11
platform = linux
files = scripts/*.py, scripts/workstation/*.py
mypy_path = scripts
explicit_package_bases = True
warn_unused_ignores = True
warn_redundant_casts = True
enable_error_code = ignore-without-code

[mypy-agent_task_bench]
ignore_errors = True

[mypy-agent_task_bind]
ignore_errors = True

[mypy-agent_task_check]
ignore_errors = True

[mypy-build_artifacts]
ignore_errors = True

[mypy-exchange_output_oracle]
ignore_errors = True

[mypy-measure_forms]
ignore_errors = True

[mypy-quality_ratchet]
ignore_errors = True

[mypy-workstation.install]
ignore_errors = True
