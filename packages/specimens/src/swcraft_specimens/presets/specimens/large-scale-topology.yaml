  passport_version: 1.0.0
  contract_version: 12.0.0
  layers:
    swc: 75                     # invented
    interfaces: 500             # invented (all sender-receiver or client-server here)
    connectors: 1400            # invented
    application_types: 0        # neutral
    implementation_types: 500   # invented
    base_types: 12              # invented (the usual platform types' count)
    requirements: 0             # invented
    compositions: 1             # neutral
    tasks: 0                    # invented
    sequences: 0                # neutral
    hardware: 3                 # invented (a processor, a core, a partition)
