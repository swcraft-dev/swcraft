[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "swcraft-specimens"
# A lockstep site: the version is read from `src/swcraft_specimens/__init__.py`, whose literal equals
# `swcraft_tools/_version.py`, so the wheel's metadata, `--version` and every sidecar agree.
dynamic = ["version"]
description = "SWCraft's specimen generator: deterministic synthetic automotive architecture models"
requires-python = ">=3.11"
license = "Apache-2.0"
# NumPy and SciPy are ranges; the exact versions are the lock's (`constraints/dev.txt`): the specimens
# are byte-pinned, and a different HiGHS can construct a different canonical layout.
dependencies = [
    "PyYAML>=6.0,<7",
    "numpy>=2.4.6,<3",
    "scipy>=1.17.1,<2",
]

[project.scripts]
swcraft-specimens = "swcraft_specimens.cli:main"

[dependency-groups]
# Every direct use declared directly: `mypy`, the stub packages and `ruff` are
# `scripts/run_python_lint.py`'s.
dev = [
    # `tests/test_packaged_presets.py` builds the wheel with `--no-build-isolation`.
    "hatchling",
    "jsonschema>=4.26,<5",
    "mypy>=1.10,<2",
    "pytest>=8",
    "pytest-cov>=5.0",
    # `dev.py test` runs this project's suite under `-n auto --dist loadgroup`.
    "pytest-xdist>=3.6",
    # The per-test timeout.
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "types-PyYAML>=6.0,<7",
    "types-jsonschema>=4.26,<5",
]

[tool.hatch.version]
path = "src/swcraft_specimens/__init__.py"

# The package and, as package data, the passport schema and the presets, and nothing else.
[tool.hatch.build.targets.wheel]
packages = ["src/swcraft_specimens"]
include = [
    "src/swcraft_specimens/**/*.py",
    "src/swcraft_specimens/passport_schema/*.json",
    "src/swcraft_specimens/presets/*.yaml",
    "src/swcraft_specimens/presets/specimens/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project root on sys.path for `tests.oracle`.
pythonpath = ["."]
addopts = "-q"
# pytest-timeout's stage ceiling; the fast gate's own value is in packages/tools/pyproject.toml.
timeout = 1200
required_plugins = ["pytest-timeout>=2.3"]
markers = [
    "integration: runs the external SWCraft CLI named by SWCRAFT_BIN (skipped when unset). Deselected from the fast 'dev.py test' gate, executed only by 'dev.py test-model-integration', which sets SWCRAFT_BIN to .venv's swcraft, which 'dev.py verify' invokes and which may NOT collect nothing here (scripts/dev.py MARKER_STAGE_OWNERS)",
    "slow: long-running checks. Deselected from the fast 'dev.py test' gate, executed only by 'dev.py test-slow', which 'dev.py verify' invokes and which may NOT collect nothing here (scripts/dev.py MARKER_STAGE_OWNERS). The suites are not restated here: packages/tools/tests/test_slow_marker_inventory.py derives them from the marks",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/swcraft_specimens", "tests"]
# Module names come from the directory bases: `src` holds `swcraft_specimens`, and `tests/oracle` and
# `tests/scenarios` are `tests.oracle` and `tests.scenarios` (as the tests import them).
explicit_package_bases = true
mypy_path = "src"

# SciPy ships no type information; the solve function returns plain integers, so no SciPy type
# leaves the module that imports it.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
