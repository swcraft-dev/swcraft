name: Relay
type: application
description: >-
  The only member of `Edge`, and the inner side of both delegations: its provide
  port carries the wider sender-receiver interface and its require port the
  narrower client-server one, so each delegation joins two differently named
  interfaces.
ports:
  - name: pStatusOut
    direction: provide
    interface: IStatusFull
  - name: rCommandIn
    direction: require
    interface: ICommandBasic
handle_termination_and_restart: no_support
satisfies:
- REQ_COMPATIBLE_001@1
