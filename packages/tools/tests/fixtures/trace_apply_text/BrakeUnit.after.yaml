# A component written by hand: comments, blank lines, its own key order and quoting.
name: BrakeUnit   # the unit
description: >-
  Supervises the brake temperature
  and reports a fault.

kind: application
asil: "B"

ports:
  - name: pBrakeTemp          # the provided temperature
    direction: provided
    interface: IBrakeTemp
    satisfies:
      - SR-1@1   # linked in the first review
      - SR-2@1
      - SR-3@4

  - name: pFault
    satisfies:
    - SR-4@1
    direction: provided
    interface: IFault

runnables:
- name: Supervise
  description: 'supervise it'
  satisfies: [SR-1@2, SR-5@1]
- name: Init
  satisfies: [SR-6@1]
satisfies:
- SR-7@2
