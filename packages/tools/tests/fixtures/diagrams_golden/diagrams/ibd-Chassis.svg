</g>
<g class="members">
<g class="member component" data-role="member" data-name="Sensor" data-type="Sensor" data-kind="component"><title>Sensor (component)
Measures the speed and provides it twice, filtered and raw.</title><rect x="222.34" y="164" width="160" height="60" rx="3" fill="#eef3fb" stroke="#333333" stroke-width="1"/></g>
<g class="member component" data-role="member" data-name="Controller" data-type="Controller" data-kind="component"><title>Controller (component)
Consumes the speed, feeds its own estimate back to itself and asks the diagnostics.</title><rect x="462.34" y="136" width="207.24" height="106" rx="3" fill="#eef3fb" stroke="#333333" stroke-width="1"/></g>
<g class="member component" data-role="member" data-name="Logger" data-type="Logger" data-kind="component"><title>Logger (component)
Would log the speed; its one port is connected to nothing.</title><rect x="246.34" y="83" width="160" height="60" rx="3" fill="#eef3fb" stroke="#333333" stroke-width="1"/></g>
</g>
