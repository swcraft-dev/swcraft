<g class="frame" data-role="frame" data-name="VehicleControl"><title>composition VehicleControl
Vehicle control
The top of the hierarchy: the five components of the showcase stand in it side by side, and every connector the demo adds between them is drawn inside it. A connector that names no composition belongs to the root.</title><rect x="12" y="12" width="464.28" height="431" rx="4" fill="#fafafa" stroke="#333333" stroke-width="1.5"/></g>
</g>
