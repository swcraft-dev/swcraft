<g class="members">
<g id="m1" class="member component" data-role="member" data-name="VehicleStateManager" data-type="VehicleStateManager" data-kind="component"><title>VehicleStateManager (component)
Publishes the vehicle operating state the other components read.</title><rect x="206.28" y="143" width="180" height="50" rx="3" fill="#eef3fb" stroke="#333333" stroke-width="1"/></g>
<g id="m2" class="member component" data-role="member" data-name="BrakeTemperatureSensor" data-type="BrakeTemperatureSensor" data-kind="component"><title>BrakeTemperatureSensor (component)
Provides the brake temperature.</title><rect x="206.28" y="213" width="180" height="50" rx="3" fill="#eef3fb" stroke="#333333" stroke-width="1"/></g>
<g id="m3" class="member component" data-role="member" data-name="BrakeController" data-type="BrakeController" data-kind="component"><title>BrakeController (component)
Issues the brake request and reads the permitted brake action.</title><rect x="206.28" y="73" width="180" height="50" rx="3" fill="#eef3fb" stroke="#333333" stroke-width="1"/></g>
<g id="m4" class="member component" data-role="member" data-name="DiagnosticManager" data-type="DiagnosticManager" data-kind="component"><title>DiagnosticManager (component)
Receives the thermal-protection events.</title><rect x="206.28" y="283" width="180" height="50" rx="3" fill="#eef3fb" stroke="#333333" stroke-width="1"/></g>
<g id="m5" class="member component" data-role="member" data-name="InstrumentCluster" data-type="InstrumentCluster" data-kind="component"><title>InstrumentCluster (component)
Shows the thermal-protection status to the driver.</title><rect x="206.28" y="353" width="180" height="50" rx="3" fill="#eef3fb" stroke="#333333" stroke-width="1"/></g>
</g>
