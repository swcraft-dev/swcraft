<rect class="background" width="100%" height="100%" fill="white"/>
<g class="frame">
<g class="frame" data-role="frame" data-name="Sub" data-parents="Root#Sub"><title>composition Sub
Producing sub-composition
Two boundary ports, three members -- one of them named differently from its type and one of them an external stub -- two delegations and the assembly connector drawn at this level.</title><rect x="46" y="22" width="741.12" height="274" rx="4" fill="#fafafa" stroke="#333333" stroke-width="1.5"/></g>
</g>
<g class="edges">
<g class="edge connector" data-role="connector" data-name="sub_link" data-source="p4" data-target="p5" stroke-width="1"><title>connector sub_link: Alpha.pInner -&gt; Gamma.rInner
The assembly connector drawn inside `Sub`. Its `from` endpoint names the TYPE `Beta`; the member of that type inside `Sub` is `Alpha`, so the emitted CONTEXT-COMPONENT-REF ends at `.../Sub/Alpha` and the TARGET-P-PORT-REF at `.../Beta/pInner`.</title><path id="e1" d="M 424.72 209.33 L 434.72 209.33 L 434.72 125.33 L 444.72 125.33" fill="none" stroke="#555555"/><use href="#e1" opacity="0"/></g>
<g class="edge delegation" data-role="delegation" data-name="Sub_pSignalOut_Alpha" data-source="p3" data-target="p2" stroke-width="1"><title>delegation Sub_pSignalOut_Alpha: Alpha.pOut -&gt; Sub.pSignalOut
The provide-side delegation, an INNER-PORT-IREF of the P variant.</title><path id="e2" d="M 424.72 234 L 781.12 234" fill="none" stroke="#555555"/><use href="#e2" opacity="0"/></g>
<g class="edge delegation" data-role="delegation" data-name="Sub_rTrigger_Gamma" data-source="p1" data-target="p6" stroke-width="1"><title>delegation Sub_rTrigger_Gamma: Sub.rTrigger -&gt; Gamma.rTrig
A require-side delegation, an INNER-PORT-IREF of the R variant.</title><path id="e3" d="M 52 100.67 L 444.72 100.67" fill="none" stroke="#555555"/><use href="#e3" opacity="0"/></g>
</g>
<g class="members">
<g class="member component" data-role="member" data-name="Alpha" data-type="Beta" data-kind="component"><title>Alpha : Beta (component)
The type the member `Alpha` of composition `Sub` instantiates -- the member whose name differs from its type, which is what makes the two reference bases of an assembly connector and a delegation observable.</title><rect x="216.44" y="191.67" width="182.28" height="60" rx="3" fill="#eef3fb" stroke="#333333" stroke-width="1"/></g>
<g class="member component" data-role="member" data-name="Gamma" data-type="Gamma" data-kind="component"><title>Gamma (component)
The require side of the assembly connector drawn inside `Sub`.</title><rect x="468.72" y="83" width="160" height="60" rx="3" fill="#eef3fb" stroke="#333333" stroke-width="1"/></g>
<g class="member component" data-role="member" data-name="Ext" data-type="ExternalStub" data-kind="component"><title>Ext : ExternalStub (component)
A component this model declares a prototype for and no type for: the writer emits the two verbatim strings below as the prototype's TYPE-TREF and DEST and emits no APPLICATION-SW-COMPONENT-TYPE at all. It carries no ports, so nothing can be wired to it.</title><rect x="240.58" y="111.67" width="160" height="60" rx="3" fill="#eef3fb" stroke="#333333" stroke-width="1"/></g>
</g>
