<g class="edge-count" data-name="Sub -&gt; Sink"><title>1 connector Sub -&gt; Sink</title><desc class="connector-list">root_link: Sub.pSignalOut -&gt; Sink.rSignalIn — ISignal	The root's one assembly connector, between two composition-typed endpoints. It names no composition of its own, so it belongs to the root -- resolved where the model is in hand, never written into the file.</desc><rect class="edge-label" x="336.84" y="100" width="13.5" height="16" rx="2" fill="white" stroke="#999999"/><text class="edge-label-text" x="343.59" y="111" font-size="10" text-anchor="middle" font-weight="600">1</text></g>
