<g class="frame" data-role="frame" data-name="Root"><title>composition Root
Root composition
The top of the hierarchy. Both of its members are compositions, a shape a tool export's top level can have: a connector there joins two composition prototypes and therefore names two composition TYPES.</title><rect x="22" y="22" width="644.52" height="161" rx="4" fill="#fafafa" stroke="#333333" stroke-width="1.5"/></g>
</g>
<g class="edges">
<g class="edge connector" data-role="connector" data-name="root_link" data-source="p2" data-target="p3" stroke-width="1"><title>connector root_link: Sub.pSignalOut -&gt; Sink.rSignalIn
The root's one assembly connector, between two composition-typed endpoints. It names no composition of its own, so it belongs to the root -- resolved where the model is in hand, never written into the file.</title><path id="e1" d="M 370.88 113 L 390.88 113" fill="none" stroke="#555555"/><use href="#e1" opacity="0"/></g>
</g>
