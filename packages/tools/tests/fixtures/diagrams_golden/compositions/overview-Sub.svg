<g class="frame">
<g class="frame" data-role="frame" data-name="Sub" data-parents="Root#Sub"><title>composition Sub
Producing sub-composition
Two boundary ports, three members -- one of them named differently from its type and one of them an external stub -- two delegations and the assembly connector drawn at this level.</title><rect x="12" y="12" width="619.74" height="221" rx="4" fill="#fafafa" stroke="#333333" stroke-width="1.5"/></g>
</g>
<g class="edges">
<g class="edge bundle" data-role="bundle" data-name="Alpha -&gt; Gamma" data-source="m1" data-target="m2" stroke-width="1"><title>1 connector Alpha -&gt; Gamma</title><path id="e1" d="M 312.24 168 L 357.74 168" fill="none" stroke="#555555" marker-end="url(#swcraft-arrow)"/><use href="#e1" opacity="0"/></g>
</g>
<g class="members">
<g id="m1" class="member component" data-role="member" data-name="Alpha" data-type="Beta" data-kind="component"><title>Alpha : Beta (component)
The type the member `Alpha` of composition `Sub` instantiates -- the member whose name differs from its type, which is what makes the two reference bases of an assembly connector and a delegation observable.</title><rect x="132.24" y="143" width="180" height="50" rx="3" fill="#eef3fb" stroke="#333333" stroke-width="1"/></g>
<g id="m2" class="member component" data-role="member" data-name="Gamma" data-type="Gamma" data-kind="component"><title>Gamma (component)
The require side of the assembly connector drawn inside `Sub`.</title><rect x="361.74" y="143" width="180" height="50" rx="3" fill="#eef3fb" stroke="#333333" stroke-width="1"/></g>
<g id="m3" class="member component" data-role="member" data-name="Ext" data-type="ExternalStub" data-kind="component"><title>Ext : ExternalStub (component)
A component this model declares a prototype for and no type for: the writer emits the two verbatim strings below as the prototype's TYPE-TREF and DEST and emits no APPLICATION-SW-COMPONENT-TYPE at all. It carries no ports, so nothing can be wired to it.</title><rect x="132.24" y="73" width="180" height="50" rx="3" fill="#eef3fb" stroke="#333333" stroke-width="1"/></g>
</g>
<g class="labels">
<g class="frame-up"><title>up to Root</title><text class="frame-label" x="19" y="28.6" font-size="12" data-kind="composition" font-weight="bold">↑ Sub — Producing sub-composition</text></g>
<g class="edge-count" data-name="Alpha -&gt; Gamma"><title>1 connector Alpha -&gt; Gamma</title><desc class="connector-list">sub_link: Alpha.pInner -&gt; Gamma.rInner — ITrigger	The assembly connector drawn inside `Sub`. Its `from` endpoint names the TYPE `Beta`; the member of that type inside `Sub` is `Alpha`, so the emitted CONTEXT-COMPONENT-REF ends at `.../Sub/Alpha` and the TARGET-P-PORT-REF at `.../Beta/pInner`.</desc><rect class="edge-label" x="330.24" y="170" width="13.5" height="16" rx="2" fill="white" stroke="#999999"/><text class="edge-label-text" x="336.99" y="181" font-size="10" text-anchor="middle" font-weight="600">1</text></g>
<text class="member-label" x="180.3" y="171.6" font-size="12" data-kind="component" font-weight="600">Alpha : Beta</text>
<text class="member-label" x="434.52" y="171.6" font-size="12" data-kind="component" font-weight="600">Gamma</text>
<text class="member-label" x="159.78" y="101.6" font-size="12" data-kind="component" font-weight="600">Ext : ExternalStub</text>
</g>
