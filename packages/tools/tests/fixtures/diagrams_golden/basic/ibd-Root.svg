<g class="frame" data-role="frame" data-name="Root"><title>composition Root
Root composition
The top of the hierarchy: every component this project declares stands in it once, and the connector between them is drawn inside it. A connector that names no composition belongs to the root, which is why Example_to_Consumer carries no `composition:` key.</title><rect x="22" y="22" width="638.24" height="161" rx="4" fill="#fafafa" stroke="#333333" stroke-width="1.5"/></g>
</g>
