name: DiagnosticManager
type: application
ports:
- name: rThermalProtectionEvent
  direction: require
  interface: IThermalProtectionEvent
  com_specs:
  - data_element: event
    queue_length: 4
- name: pBrakeDiagnostics
  direction: provide
  interface: IBrakeDiagnostics
- name: rNvStorage
  direction: require
  interface: INvStorage
- name: rEcuMode
  direction: require
  interface: IEcuMode
runnables:
- name: ProcessDiagnosticEvent
  events:
  - type: timing
    period: 0.1
    disabled_modes:
    - port: rEcuMode
      mode_group_ref: /Platform/Interfaces/EcuMode/currentMode
      mode_ref: /Platform/ModeDeclarationGroups/EcuModes/SLEEP
  reads:
  - port: rThermalProtectionEvent
    element: event
  calls:
  - port: rNvStorage
    operation: WriteBlock
    name: Call_StoreSnapshot
  satisfies:
  - REQ_BTP_DIAGNOSTICS@1
- name: ServeSnapshot
  concurrent: true
  events:
  - type: operation
    port: pBrakeDiagnostics
    operation: ReadSnapshot
    name: OIT_ServeReadSnapshot
behavior_name: DiagnosticManagerBehavior
memory:
  RAM: 1536
handle_termination_and_restart: can_be_terminated
data_type_mappings:
- BrakeThermalMappings
