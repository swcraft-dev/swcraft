# The agent task benchmark's bench: the Vehicle Control showcase's model at showcase
# 4fdc642 (SWCraft 0.18.1), copied so every expected answer of ../tasks/ is pinned to
# one model. No `toolchain_version`: a pin would refuse every writing command the day the
# toolchain moves past the release the copy was taken at, and the bench is run with
# whatever toolchain is being measured. A run works on a copy of this directory, never
# on it (../README.md).
name: vehicle-control-showcase
schema_version: "1.0"
arxml_version: "4.3.0"
model_root: model
dist_root: dist
views_root: views
outputs:
  arxml: dist/model.arxml
  needs: dist/needs.json
