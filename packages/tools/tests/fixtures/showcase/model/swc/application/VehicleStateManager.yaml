name: VehicleStateManager
type: application
ports:
- name: pOperatingState
  direction: provide
  interface: IVehicleOperatingState
runnables:
- name: PublishOperatingState
  events:
  - type: timing
    period: 0.05
memory:
  RAM: 2048
handle_termination_and_restart: no_support
satisfies:
- REQ_SHOWCASE_BASELINE_001@1
