name: SensorSwc
type: application
ports:
- name: pSpeed
  direction: provide
  interface: IVehicleSpeed
- name: pPose
  direction: provide
  interface: IPose
- name: rCalib
  direction: require
  interface: ICalibration
runnables:
- name: SensorMain
  min_start_interval: 0.005
  events:
  - type: timing
    period: 0.01
  - type: init
handle_termination_and_restart: no_support
satisfies:
- REQ-EXCH-001@1
