name: DiagServer
type: application
description: Serves the diagnostic status.
ports:
  - name: pDiag
    direction: provide
    interface: IDiag
runnables:
  - name: ServeRun
    events:
      - type: timing
        period: 0.01
handle_termination_and_restart: no_support
satisfies:
- REQ_DIAGRAMS_001@1
