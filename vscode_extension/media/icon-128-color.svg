<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Marketplace / gallery variant: same mark, scaled, on a rounded dark tile.
       Source of truth for media/icon-128-color.png, which package.json's `icon`
       points at; rasterised with sharp-cli 5.1.0 (png, resize 128 128), the
       command icon.test.ts quotes.
       NOT the same image as media/icon.svg: that one is the Activity Bar mark,
       monochrome by design because the Activity Bar paints it via currentColor.
       This one carries its own background, because the Extensions view and the
       gallery place it on theirs. -->
  <rect width="128" height="128" rx="24" fill="#1F2A44"/>
  <g fill="none" stroke="#E8EDF7" stroke-width="8">
    <rect x="16" y="72" width="42" height="36"/>
    <rect x="82" y="20" width="42" height="36"/>
    <rect x="51" y="83" width="14" height="14"/>
    <rect x="75" y="31" width="14" height="14"/>
    <path d="M65 90 H70 V38 H75" stroke-linejoin="miter"/>
  </g>
</svg>
