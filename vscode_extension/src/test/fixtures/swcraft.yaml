# Workspace manifest of the smoke test (`smoke.test.ts`): its presence fires the
# `workspaceContains:swcraft.yaml` activation event, and `model_root` points at the two-file
# model (one component with one port, and that port's interface) the navigation assertions
# read. Not a buildable model: no root composition, no hardware.
name: swcraft-vscode-smoke-fixture
schema_version: "1.0"
model_root: model
dist_root: dist
views_root: views
outputs:
  arxml: dist/model.arxml
  needs: dist/needs.json
